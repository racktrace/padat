baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Padat'

[params]
  description = 'A plain Hugo starter.'
  mainSections = ['notes']
  # logo = 'images/logo.svg'
  # favicon = 'favicon.svg'

[menus]
  [[menus.main]]
    name = 'Notes'
    pageRef = '/notes'
    weight = 10
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 20

[taxonomies]
  tag = 'tags'

[markup.highlight]
  noClasses = false

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[[cascade]]
  [cascade.build]
    publishResources = false

