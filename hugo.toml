baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Padat'

enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[params]
  description = 'A plain Hugo starter.'
  mainSections = ['notes']
  recentCount = 10
  search = true
  author = 'padat'
  # images = ['images/og.png']
  # copyright = 'Custom footer text'
  # logo = 'images/logo.svg'
  # favicon = 'favicon.svg'

[menus]
  [[menus.main]]
    name = 'Notes'
    pageRef = '/notes'
    weight = 10
  [[menus.main]]
    name = 'Archive'
    pageRef = '/archive'
    weight = 20
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40

[taxonomies]
  tag = 'tags'

[markup.highlight]
  noClasses = false

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[[cascade]]
  [cascade.build]
    publishResources = false

[services.rss]
  limit = 20
