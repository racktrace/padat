<p><a href="{{ "/" | relURL }}">
  {{- with site.Params.logo }}{{ with resources.Get . }}{{ .Content | safeHTML }} {{ end }}{{ end -}}
  {{ site.Title }}
</a></p>
{{ with site.Menus.main }}
  <nav aria-label="{{ i18n "nav_main" }}">
    <ul>
      {{ range . }}
        <li><a href="{{ .URL }}"
          {{- if or ($.IsMenuCurrent .Menu .) ($.HasMenuCurrent .Menu .) }} aria-current="page"{{ end }}>
          {{- .Name -}}
        </a></li>
      {{ end }}
    </ul>
  </nav>
{{ end }}
