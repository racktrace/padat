<!doctype html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a href="#main">{{ i18n "skip_to_content" }}</a>
  <header>
    {{ partial "header.html" . }}
  </header>
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ partial "footer.html" . }}
  </footer>
    {{ partial "hooks/body-end.html" . }}
</body>
</html>
