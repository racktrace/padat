name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo apt-get install -y /tmp/hugo.deb
          hugo version

      - name: Build
        run: hugo build --minify --cleanDestinationDir

      - name: Check page weight
        env:
          BUDGET: 10240
        run: ./scripts/check-weight.sh

      - name: Validate XML
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxml2-utils
          find public -name '*.xml' -print0 | xargs -0 xmllint --noout
          echo "All XML files are valid"
