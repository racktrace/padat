name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.169.0
  VNU_VERSION: 26.11.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo apt-get install -y /tmp/hugo.deb
          hugo version

      - name: Build
        run: hugo build --minify --cleanDestinationDir

      - name: Check page weight
        env:
          BUDGET: 10240
        run: ./scripts/check-weight.sh

      - name: Validate XML
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxml2-utils
          find public -name '*.xml' -print0 | xargs -0 xmllint --noout
          echo "All XML files are valid"

      - name: Validate HTML
        run: |
          java -version
          npm install --prefix /tmp/vnu --no-save --silent "vnu-jar@${VNU_VERSION}"
          VNU_JAR=$(node -p "String(require('/tmp/vnu/node_modules/vnu-jar'))")
          java -jar "$VNU_JAR" --skip-non-html --errors-only public/
          echo "All HTML files are valid"

      - name: Check links
        uses: untitaker/hyperlink@0.3.1
        with:
          args: public/ --check-anchors --sources content/
